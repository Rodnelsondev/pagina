<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!--
      O head contém informações gerais da página,
      como o conjunto de caracteres, a responsividade e o link para o CSS.
      Ele não aparece visualmente, mas define como o navegador vai interpretar a página.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rodnelson</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!--
      Essas duas divs ficam no fundo e criam o efeito de bolhas suaves.
      Elas ajudam a dar profundidade ao fundo e deixam a página mais bonita.
    -->
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <!--
      Este é o container principal do formulário.
      É o bloco que recebe o efeito glassmorphism.
    -->
    <main class="login-glss-card">
      <!--
        Essa área mostra a marca da página.
        O ícone e o nome ficam juntos para criar uma identidade visual.
      -->
      <div class="brand">
        <span class="brand-mark">R</span>
        <span>Rodnelson</span>
      </div>

      <!--
        Título principal da tela.
        Ele mostra a mensagem inicial para o usuário entrar no sistema.
      -->
      <h1>Bem-vindo</h1>

      <!--
        Formulário de login.
        Aqui ficam os campos de email e senha para o usuário entrar.
      -->
      <form id="login-panel" class="auth-form">
        <h2>Login</h2>

        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" required />

        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" placeholder="Sua senha" required />

        <button type="submit">Entrar</button>
      </form>

      <!--
        Formulário de cadastro.
        Esse bloco fica escondido inicialmente e aparece quando o usuário quer criar uma conta.
      -->
      <form id="registerForm" class="auth-form hidden">
        <h2>Cadastro</h2>

        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" placeholder="seu@email.com" required />

        <label for="registerPassword">Senha</label>
        <input type="password" id="registerPassword" placeholder="Crie uma senha" required />

        <button type="submit">Cadastrar</button>
      </form>

      <!--
        Esses botões alternam entre as telas de login e cadastro.
        Um mostra a opção de cadastro e o outro volta para login.
      -->
      <div class="auth-switch">
        <button id="switchToRegister" type="button">Não tem conta? Cadastre-se</button>
        <button id="switchToLogin" type="button" class="hidden">Já tem conta? Faça login</button>
      </div>
    </main>
  </body>
</html>
